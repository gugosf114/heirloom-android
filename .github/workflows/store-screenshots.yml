# Redraws the Play Store screenshots whenever the photos or the drawing script change on main.
# The PNGs land in docs/store/screenshots (committed back, [skip ci]) and as a build artifact.
# Uploading them to Play stays a manual step: /root/.play/play.py from the box (see docs/store/README.md).
name: Store screenshots

on:
  push:
    branches: [main]
    paths:
      - 'docs/store/photos/**'
      - 'docs/store/make_screenshots.py'
      - 'app/src/main/res/font/**'
      - '.github/workflows/store-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: store-screenshots

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 docs/store/make_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: heirloom-store-screenshots
          path: docs/store/screenshots/*.png
      - name: Commit the redrawn pictures
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/store/screenshots
          git commit -m "chore: store screenshots redrawn [skip ci]" || exit 0
          git push
