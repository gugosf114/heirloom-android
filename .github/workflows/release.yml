name: Play release build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Signed AAB + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Load Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.HEIRLOOM_UPLOAD_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/heirloom-upload.jks"
          chmod 600 "$RUNNER_TEMP/heirloom-upload.jks"

      - name: Build signed release bundle and APK
        env:
          UPLOAD_PASSWORD: ${{ secrets.HEIRLOOM_UPLOAD_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PHEIRLOOM_UPLOAD_STORE="$RUNNER_TEMP/heirloom-upload.jks" \
            -PHEIRLOOM_UPLOAD_PASSWORD="$UPLOAD_PASSWORD"

      - name: Read version
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Heirloom-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: heirloom-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: heirloom-apk
          path: Heirloom-${{ steps.ver.outputs.name }}.apk

      - name: Publish giveaway APK + dated README link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.name }}
          VC: ${{ steps.ver.outputs.code }}
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "Heirloom-$VER.apk" --title "Heirloom $VER" --notes "Signed release build $VER (version code $VC), built $TODAY."
          LINK="> ## [⬇ DOWNLOAD THE LATEST ANDROID APK — $TODAY](https://github.com/${{ github.repository }}/releases/latest/download/Heirloom-$VER.apk)"
          STATE="> **Current build: $VER · Android version code $VC · $TODAY**"
          python3 - "$LINK" "$STATE" <<'PY'
          import re, sys
          link, state = sys.argv[1], sys.argv[2]
          t = open('README.md').read()
          lines = t.split('\n')
          # drop any previous download/current-build lines at the top
          while lines and (lines[0].startswith('> ## [⬇') or lines[0].startswith('> **Current build') or lines[0].startswith('[Download the Studio') or lines[0].strip() == '>' or lines[0].strip() == ''):
              lines.pop(0)
          open('README.md', 'w').write(link + '\n' + state + '\n\n' + '\n'.join(lines))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "chore: giveaway APK $VER ($TODAY), README link dated [skip ci]" || exit 0
          git push
